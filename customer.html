<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer + Location</title>
<link rel="stylesheet" href="customer.css">
</head>
<body>

<header class="topbar">
    <h2>👤 Customer Registration + Hotel Location</h2>
    <a href="../index.html" class="back-btn">⬅ Dashboard</a>
</header>

<div class="box">

<form id="customer-form">

    <h3>Customer Details</h3>

    <label>Full Name</label>
    <input type="text" id="cust-name" required>

    <label>Phone Number</label>
    <input type="text" id="cust-phone" required>

    <label>Email ID</label>
    <input type="email" id="cust-email" required>

    <label>ID Proof (Aadhar/Passport)</label>
    <input type="text" id="cust-id-proof" required>

    <label>No. of Persons</label>
    <input type="number" id="cust-person" required>


    <h3>Choose Hotel Location</h3>

    <label>Country</label>
    <select id="country-select" required>
        <option value="">--Select--</option>
    </select>

    <label>State</label>
    <select id="state-select" required>
        <option value="">--Select--</option>
    </select>

    <label>City</label>
    <select id="city-select" required>
        <option value="">--Select--</option>
    </select>

    <label>Area / Branch</label>
    <select id="branch-select" required>
        <option value="">--Select--</option>
    </select>

    <h3>Stay Information</h3>

    <label>Check-in</label>
    <input type="date" id="cust-in" required>

    <label>Check-out</label>
    <input type="date" id="cust-out" required>

    <button type="submit">Save Details</button>

</form>

</div>

<script src="customer.js"></script>
</body>
</html>
